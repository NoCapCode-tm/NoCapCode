<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NoCapCode</title>
    <!-- Prevent Google from indexing the raw SPA redirect utility -->
    <meta name="robots" content="noindex">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var path = window.location.pathname;
      var isBot = /bot|googlebot|crawler|spider|robot|crawling/i.test(navigator.userAgent);
      var isStaticAsset = /\.(png|jpg|jpeg|gif|svg|webp|webm|mp4|json|xml|txt|css|js|map)$/i.test(path);
      
      // Prevent bots and static asset requests from triggering the redirect loop
      if (!isStaticAsset && !isBot) {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
