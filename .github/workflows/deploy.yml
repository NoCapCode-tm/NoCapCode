name: Production Deployment (CI/CD)

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Optimize package.json, Patch Highland Stream Bug, Inject Routes, and Neutralize 404.html
      - name: Inject Dynamic Routes & Neutralize 404.html
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          const highlandPath = 'node_modules/highland/lib/index.js';
          if (fs.existsSync(highlandPath)) {
            let hl = fs.readFileSync(highlandPath, 'utf8');
            hl = hl.replace(\"throw new Error('Cannot write to stream after nil');\", \"return;\");
            fs.writeFileSync(highlandPath, hl);
          }

          const fetchJson = (url) => new Promise((resolve) => {
            https.get(url, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); } 
                catch(e) { resolve({message: []}); }
              });
            }).on('error', () => resolve({message: []}));
          });

          async function processPackage() {
            try {
              fs.copyFileSync('public/404.html', 'public/404-backup.html');
              fs.writeFileSync('public/404.html', '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>404</title></head><body></body></html>');

              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              if (!pkg.reactSnap) pkg.reactSnap = {};

              pkg.reactSnap.puppeteerExecutablePath = '/usr/bin/google-chrome';
              pkg.reactSnap.port = 8000;
              pkg.reactSnap.concurrency = 1; 
              pkg.reactSnap.ignoreBrowserErrors = true;
              pkg.reactSnap.fixWebpackChunksIssue = false;
              pkg.reactSnap.skipThirdPartyRequests = false;
              pkg.reactSnap.crawl = false;
              pkg.reactSnap.delay = 2500;

              pkg.reactSnap.puppeteerArgs = [
                '--no-sandbox', 
                '--disable-setuid-sandbox',
                '--disable-web-security',
                '--disable-gpu',
                '--disable-dev-shm-usage',
                '--disable-software-rasterizer'
              ];

              const jobsRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getjobs');
              const jobs = jobsRes.message || [];
              const jobRoutes = jobs.map(j => '/careers/' + j._id);

              const portfolioRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getallcasestudy');
              const portfolioItems = portfolioRes.message || [];
              const portfolioRoutes = portfolioItems.map(p => '/portfolio/' + (p._id || p.title));

              fs.writeFileSync('prerender-meta.json', JSON.stringify({ jobs, portfolioItems }, null, 2));
              
              const bespokeRoutes = [
                '/portfolio/website-design/medvitals-ai-triage',
                '/portfolio/logo-redesign/symbol-of-identity',
                '/portfolio/logo-redesign/axon-human-connection'
              ];

              if(!pkg.reactSnap.include) pkg.reactSnap.include = [];
              pkg.reactSnap.include.push(...jobRoutes, ...portfolioRoutes, ...bespokeRoutes, '/portfolio');
              
              const normalizedRoutes = pkg.reactSnap.include.map(r => (r !== '/' && r.endsWith('/')) ? r.slice(0, -1) : r);
              pkg.reactSnap.include = [...new Set(normalizedRoutes)];
              
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              console.log('Successfully injected ' + pkg.reactSnap.include.length + ' unique SEO routes.');
            } catch (err) {
              console.error('Error modifying package.json:', err);
              process.exit(1);
            }
          }
          processPackage();
          "

      # 5. Build application and generate pre-rendered static paths via react-snap
      - name: Execute System Production Build
        run: npm run build || true
        env:
          CI: false

      # 6. Compress All Images in build/ to eliminate image size warnings
      - name: Optimize Large Images
        run: |
          sudo apt-get update && sudo apt-get install -y pngquant jpegoptim imagemagick
          find build -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -size +180k -exec mogrify -strip -resize "1280x1280>" -quality 80 {} + || true
          find build -type f -iname "*.png" -size +180k -exec pngquant --force --ext .png --quality=65-80 {} + || true
          find build -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -size +180k -exec jpegoptim --max=78 --strip-all {} + || true

      # 7. Post-Process HTML for Guaranteed SEO, AI Schema, Links, Sitemap & IndexNow
      - name: Post-Process HTML, Generate Sitemap & Ping IndexNow
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const baseUrl = 'https://nocapcode.cloud';
          const buildDir = path.join(process.cwd(), 'build');

          const file200 = path.join(buildDir, '200.html');
          if (fs.existsSync(file200)) fs.unlinkSync(file200);
          const kalinDir = path.join(buildDir, 'portfolio/website-design/kalin-construction');
          if (fs.existsSync(kalinDir)) fs.rmSync(kalinDir, { recursive: true, force: true });

          let metaData = { jobs: [], portfolioItems: [] };
          if (fs.existsSync('prerender-meta.json')) {
            metaData = JSON.parse(fs.readFileSync('prerender-meta.json', 'utf8'));
          }

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const baseIndexHtml = fs.readFileSync(path.join(buildDir, 'index.html'), 'utf8');
          for (const route of (pkg.reactSnap?.include || [])) {
            if (route === '/') continue;
            const routeDir = path.join(buildDir, route.replace(/^\//, ''));
            const routeHtmlPath = path.join(routeDir, 'index.html');
            if (!fs.existsSync(routeHtmlPath)) {
              fs.mkdirSync(routeDir, { recursive: true });
              fs.writeFileSync(routeHtmlPath, baseIndexHtml);
            }
          }

          const walkSync = (dir, filelist = []) => {
            if (!fs.existsSync(dir)) return filelist;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const filepath = path.join(dir, file);
              if (fs.statSync(filepath).isDirectory()) {
                filelist = walkSync(filepath, filelist);
              } else if (
                filepath.endsWith('.html') &&
                !filepath.endsWith('404.html') &&
                !filepath.endsWith('404-backup.html') &&
                !filepath.endsWith('404_2.html') &&
                !filepath.endsWith('200.html')
              ) {
                filelist.push(filepath);
              }
            }
            return filelist;
          };
          
          const htmlFiles = walkSync(buildDir);
          const today = new Date().toISOString().split('T')[0];
          const isoNow = new Date().toISOString();

          const allJobLinks = metaData.jobs.map(j => \`<a href=\"/careers/\${j._id}/\">\${j.title || 'Software Role'}</a>\`).join(' ');
          const allPortLinks = metaData.portfolioItems.map(p => \`<a href=\"/portfolio/\${p._id || p.title}/\">\${p.title || 'Case Study'}</a>\`).join(' ');
          const coreLinks = '<a href=\"/\">Home</a> <a href=\"/about/\">About</a> <a href=\"/services/\">Services</a> <a href=\"/portfolio/\">Portfolio</a> <a href=\"/careers/\">Careers</a> <a href=\"/clarity/\">Clarity</a> <a href=\"/contact/\">Contact</a> <a href=\"/terms/\">Terms</a> <a href=\"/privacy/\">Privacy</a> <a href=\"/security/\">Security</a> <a href=\"/portfolio/website-design/medvitals-ai-triage/\">MedVitals AI</a> <a href=\"/portfolio/logo-redesign/symbol-of-identity/\">Symbol of Identity</a> <a href=\"/portfolio/logo-redesign/axon-human-connection/\">AXON</a>';
          const globalSeoNav = \`<nav aria-label=\"Site Directory\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;\">\${coreLinks} \${allJobLinks} \${allPortLinks}</nav>\`;

          let sitemapContent = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n';
          sitemapContent += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n';
          const allLocUrls = [];
          
          for (const file of htmlFiles) {
            let route = file.replace(buildDir, '').replace(/\\\\/g, '/');
            route = route.replace('/index.html', '').replace('.html', '');
            if (route === '' || route === '/') {
              route = '/';
            } else if (!route.endsWith('/')) {
              route = route + '/';
            }
            const locUrl = \`\${baseUrl}\${route}\`;
            allLocUrls.push(locUrl);

            let html = fs.readFileSync(file, 'utf8');

            if (!html.includes('<!--email_off-->')) {
              html = html.replace('<body', '<!--email_off--><body').replace('</body>', '</body><!--/email_off-->');
            }
            html = html.replace(/href=\"mailto:[^\"]*\"/gi, 'href=\"https://nocapcode.cloud/contact/\"');
            html = html.replace(/href=\"https:\/\/nocapcode\.cloud\/book\"/gi, 'href=\"https://calendar.app.google/vG14eBrGNsD2znht5\"');
            html = html.replace(/href=\"http:\/\/linkedin\.com\/company\/nocapcode\/?\"/gi, 'href=\"https://www.linkedin.com/company/nocapcode\"');
            html = html.replace(/https:\/\/nocapcode\.cloud\/portfolio\/website-design\/kalin-construction\/?/gi, 'https://nocapcode.cloud/portfolio/website-design/medvitals-ai-triage/');

            if (route === '/at/') {
              html = html.replace('<html lang=\"en\"', '<html lang=\"de-at\"');
            }

            html = html.replace(
              /\"author\":\{\"@type\":\"Organization\",\"@id\":\"https:\/\/nocapcode\.cloud\/#organization\"\}/g,
              '\"author\":{\"@type\":\"Organization\",\"@id\":\"https://nocapcode.cloud/#organization\",\"name\":\"NoCapCode\",\"url\":\"https://nocapcode.cloud/\"}'
            );
            html = html.replace(
              /\"publisher\":\{\"@type\":\"Organization\",\"@id\":\"https:\/\/nocapcode\.cloud\/#organization\"\}/g,
              '\"publisher\":{\"@type\":\"Organization\",\"@id\":\"https://nocapcode.cloud/#organization\",\"name\":\"NoCapCode\",\"url\":\"https://nocapcode.cloud/\"}'
            );

            let extractedTitle = 'NoCapCode™ | Custom Software Development & AI Automation';
            const titleMatch = html.match(/<title>([^<]+)<\/title>/i);
            if (!titleMatch) {
              let pageTitle = 'NoCapCode™ | Custom Software Development & AI Automation';
              let pageDesc = 'NoCapCode builds custom software, SaaS platforms, websites, mobile apps, and AI automation systems for startups and modern businesses worldwide.';

              if (route.startsWith('/careers/') && route !== '/careers/') {
                const jobId = route.split('/').filter(Boolean)[1];
                const jobObj = metaData.jobs.find(j => j._id === jobId);
                const roleTitle = jobObj && jobObj.title ? jobObj.title : 'Software Engineering Role';
                const dept = jobObj && jobObj.department ? jobObj.department : 'Engineering';
                pageTitle = \`\${roleTitle} | NoCapCode Careers\`.slice(0, 60);
                pageDesc = \`Apply for the \${roleTitle} role in the \${dept} team at NoCapCode and help build scalable software systems and AI automation products.\`.slice(0, 155);
              } else if (route.startsWith('/portfolio/') && route !== '/portfolio/') {
                const projId = route.split('/').filter(Boolean)[1];
                const projObj = metaData.portfolioItems.find(p => p._id === projId || p.id === projId);
                const projTitle = projObj && projObj.title ? projObj.title : 'Enterprise Software Case Study';
                pageTitle = \`\${projTitle} | NoCapCode Portfolio\`.slice(0, 60);
                pageDesc = \`Explore how NoCapCode engineered \${projTitle}—delivering scalable enterprise architecture, intuitive UI/UX design, and production-grade reliability.\`.slice(0, 155);
              }
              extractedTitle = pageTitle;
              const headInjection = \`
                <title>\${pageTitle}</title>
                <meta name=\"description\" content=\"\${pageDesc}\" />
                <meta property=\"og:title\" content=\"\${pageTitle}\" />
                <meta property=\"og:description\" content=\"\${pageDesc}\" />
                <meta name=\"twitter:title\" content=\"\${pageTitle}\" />
                <meta name=\"twitter:description\" content=\"\${pageDesc}\" />
              \`;
              html = html.replace('</head>', headInjection + '</head>');
            } else {
              html = html.replace(/<title>([^<]+)<\/title>/i, (match, p1) => {
                let clean = p1.trim();
                if (clean.length > 65) {
                  clean = clean.replace('Custom Software Development & AI Automation', 'Custom Software & AI').slice(0, 65).trim();
                }
                extractedTitle = clean;
                return \`<title>\${clean}</title>\`;
              });
            }

            html = html.replace(/<meta\s+name=\"description\"\s+content=\"([^\"]*)\"\s*\/?>/i, (match, desc) => {
              let d = desc.trim();
              if (d.length < 110) {
                d = \`\${d} Engineered by NoCapCode with scalable cloud architecture, modern UI/UX design, and production-grade reliability for growing teams.\`.slice(0, 155).trim();
              } else if (d.length > 158) {
                d = d.slice(0, 155).trim() + '...';
              }
              return \`<meta name=\"description\" content=\"\${d}\" />\`;
            });

            if (!html.includes('\"@type\":\"Product\"') && (route.startsWith('/portfolio') || route === '/services/' || route === '/clarity/' || route.includes('software-development'))) {
              const productSchema = \`<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"Product\",\"name\":\"\${extractedTitle.replace(/\"/g, '')}\",\"description\":\"Custom software engineering, SaaS architecture, and digital product design by NoCapCode.\",\"image\":\"https://nocapcode.cloud/internal/og-cover.png\",\"brand\":{\"@type\":\"Brand\",\"name\":\"NoCapCode\"},\"offers\":{\"@type\":\"Offer\",\"url\":\"\${locUrl}\",\"priceCurrency\":\"INR\",\"price\":\"85000\",\"availability\":\"https://schema.org/InStock\"}}</script>\`;
              html = html.replace('</head>', productSchema + '</head>');
            }

            if (!html.includes('/llms.txt')) {
              const aiHeadLinks = \`<link rel=\"alternate\" type=\"text/markdown\" href=\"https://nocapcode.cloud/llms.txt\" title=\"NoCapCode AI Context\" /><meta property=\"og:updated_time\" content=\"\${isoNow}\" />\`;
              html = html.replace('</head>', aiHeadLinks + '</head>');
            }

            if (/<link[^>]+rel=\"canonical\"[^>]*>/i.test(html)) {
              html = html.replace(/<link[^>]+rel=\"canonical\"[^>]*>/gi, \`<link rel=\"canonical\" href=\"\${locUrl}\" />\`);
            } else {
              html = html.replace('</head>', \`<link rel=\"canonical\" href=\"\${locUrl}\" /></head>\`);
            }
            html = html.replace(/<meta[^>]+property=\"og:url\"[^>]*>/gi, \`<meta property=\"og:url\" content=\"\${locUrl}\" />\`);

            if (!html.includes('aria-label=\"Site Directory\"')) {
              html = html.replace('</body>', \`\${globalSeoNav}</body>\`);
            }

            fs.writeFileSync(file, html);
            
            sitemapContent += '  <url>\n';
            sitemapContent += \`    <loc>\${locUrl}</loc>\n\`;
            sitemapContent += \`    <lastmod>\${today}</lastmod>\n\`;
            sitemapContent += '  </url>\n';
          }
          
          sitemapContent += '</urlset>';
          fs.writeFileSync(path.join(buildDir, 'sitemap.xml'), sitemapContent);

          if (fs.existsSync('public/404-backup.html')) {
            fs.copyFileSync('public/404-backup.html', path.join(buildDir, '404.html'));
          }

          fs.writeFileSync('indexnow-urls.json', JSON.stringify(allLocUrls));
          console.log('Successfully post-processed ' + htmlFiles.length + ' HTML files.');
          "

      # 8. Securely deploy compiled assets to the target gh-pages branch
      - name: Deploy Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true

      # 9. Automatically Submit All Deployed URLs to IndexNow for Instant AI & Search Indexing
      - name: Ping IndexNow API
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');
          if (!fs.existsSync('indexnow-urls.json')) process.exit(0);
          const urlList = JSON.parse(fs.readFileSync('indexnow-urls.json', 'utf8'));
          const payload = JSON.stringify({
            host: 'nocapcode.cloud',
            key: '8fjrvm9s6e7yb643apf13kcbdp58v313',
            keyLocation: 'https://nocapcode.cloud/8fjrvm9s6e7yb643apf13kcbdp58v313.txt',
            urlList
          });
          const req = https.request({
            hostname: 'api.indexnow.org',
            path: '/indexnow',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json; charset=utf-8',
              'Content-Length': Buffer.byteLength(payload)
            }
          }, (res) => {
            console.log('IndexNow submission status:', res.statusCode);
          });
          req.on('error', (e) => console.log('IndexNow warning:', e.message));
          req.write(payload);
          req.end();
          "