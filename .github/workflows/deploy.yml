name: Production Deployment (CI/CD)

on:
  push:
    branches:
      - main # Change to 'master' if your primary branch uses the older naming convention

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment (Upgraded to Node 22 for Puppeteer v25)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Optimize package.json AND Inject Dynamic SEO Routes
      - name: Inject Dynamic Routes & Fix React-Snap Config
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          const fetchJson = (url) => new Promise((resolve, reject) => {
            https.get(url, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); } 
                catch(e) { resolve({message: []}); }
              });
            }).on('error', reject);
          });

          async function processPackage() {
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              
              if (!pkg.reactSnap) pkg.reactSnap = {};

              // Strip local Windows path for Linux CI environment
              if (pkg.reactSnap.puppeteerExecutablePath) {
                delete pkg.reactSnap.puppeteerExecutablePath;
              }

              // --- CRITICAL FIX: Ignore 404.html redirect script which breaks React.lazy CSS chunks ---
              pkg.reactSnap.ignoreBrowserErrors = true;
              pkg.reactSnap.skipThirdPartyRequests = true;
              pkg.reactSnap.puppeteerArgs = ['--no-sandbox', '--disable-setuid-sandbox'];
              pkg.reactSnap.exclude = ['/404.html', '/404'];

              // Fetch dynamic Job IDs from production backend
              const jobsRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getjobs');
              const jobs = jobsRes.message || [];
              const jobRoutes = jobs.map(j => '/careers/' + j._id);

              // Fetch dynamic Portfolio/Case Study IDs from production backend
              const portfolioRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getallcasestudy');
              const portfolioItems = portfolioRes.message || [];
              const portfolioRoutes = portfolioItems.map(p => '/portfolio/' + (p._id || p.title));
              
              // Push all dynamic routes into react-snap includes
              if(!pkg.reactSnap.include) pkg.reactSnap.include = [];
              pkg.reactSnap.include.push(...jobRoutes, ...portfolioRoutes, '/portfolio');
              
              // Remove any duplicates
              pkg.reactSnap.include = [...new Set(pkg.reactSnap.include)];
              
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              console.log('Successfully injected dynamic SEO routes and excluded 404.html from crawler.');
            } catch (err) {
              console.error('Error modifying package.json:', err);
              process.exit(1);
            }
          }
          processPackage();
          "

      # 5. Build application and generate pre-rendered static paths via react-snap
      - name: Execute System Production Build
        run: npm run build
        env:
          CI: false # Prevents warnings from being treated as fatal compilation errors

      # 6. Generate Dynamic Sitemap from compiled HTML files
      - name: Generate Dynamic Sitemap
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const baseUrl = 'https://nocapcode.cloud';
          const buildDir = path.join(process.cwd(), 'build');
          
          const walkSync = (dir, filelist = []) => {
            if (!fs.existsSync(dir)) return filelist;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const filepath = path.join(dir, file);
              if (fs.statSync(filepath).isDirectory()) {
                filelist = walkSync(filepath, filelist);
              } else if (filepath.endsWith('.html') && !filepath.endsWith('404.html') && !filepath.endsWith('404_2.html')) {
                filelist.push(filepath);
              }
            }
            return filelist;
          };
          
          const htmlFiles = walkSync(buildDir);
          const today = new Date().toISOString().split('T')[0];
          
          let sitemapContent = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n';
          sitemapContent += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n';
          
          for (const file of htmlFiles) {
            let route = file.replace(buildDir, '').replace(/\\\\/g, '/');
            route = route.replace('/index.html', '').replace('.html', '');
            if (route === '') route = '/';
            
            sitemapContent += '  <url>\n';
            sitemapContent += \`    <loc>\${baseUrl}\${route === '/' ? '/' : route}</loc>\n\`;
            sitemapContent += \`    <lastmod>\${today}</lastmod>\n\`;
            sitemapContent += '  </url>\n';
          }
          
          sitemapContent += '</urlset>';
          
          fs.writeFileSync(path.join(buildDir, 'sitemap.xml'), sitemapContent);
          console.log('Successfully generated dynamic sitemap.xml with ' + htmlFiles.length + ' URLs');
          "

      # 7. Securely deploy compiled assets to the target gh-pages branch
      - name: Deploy Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true