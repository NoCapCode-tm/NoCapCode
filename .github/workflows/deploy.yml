name: Production Deployment (CI/CD)

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Optimize package.json, Inject Routes, and Neutralize 404.html
      - name: Inject Dynamic Routes & Neutralize 404.html
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          const fetchJson = (url) => new Promise((resolve) => {
            https.get(url, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); } 
                catch(e) { resolve({message: []}); }
              });
            }).on('error', () => resolve({message: []}));
          });

          async function processPackage() {
            try {
              fs.copyFileSync('public/404.html', 'public/404-backup.html');
              fs.writeFileSync('public/404.html', '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>404</title></head><body></body></html>');

              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              if (!pkg.reactSnap) pkg.reactSnap = {};

              pkg.reactSnap.puppeteerExecutablePath = '/usr/bin/google-chrome';
              pkg.reactSnap.port = 8000;
              pkg.reactSnap.concurrency = 1; 
              pkg.reactSnap.ignoreBrowserErrors = true;
              pkg.reactSnap.fixWebpackChunksIssue = true;
              pkg.reactSnap.skipThirdPartyRequests = false;
              pkg.reactSnap.delay = 3500;

              pkg.reactSnap.puppeteerArgs = [
                '--no-sandbox', 
                '--disable-setuid-sandbox',
                '--disable-web-security',
                '--disable-gpu',
                '--disable-dev-shm-usage',
                '--disable-software-rasterizer'
              ];

              const jobsRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getjobs');
              const jobs = jobsRes.message || [];
              const jobRoutes = jobs.map(j => '/careers/' + j._id);

              const portfolioRes = await fetchJson('https://nocapcode-backend.onrender.com/api/v1/job/getallcasestudy');
              const portfolioItems = portfolioRes.message || [];
              const portfolioRoutes = portfolioItems.map(p => '/portfolio/' + (p._id || p.title));

              fs.writeFileSync('prerender-meta.json', JSON.stringify({ jobs, portfolioItems }, null, 2));
              
              const bespokeRoutes = [
                '/portfolio/website-design/medvitals-ai-triage',
                '/portfolio/logo-redesign/symbol-of-identity',
                '/portfolio/logo-redesign/axon-human-connection'
              ];

              if(!pkg.reactSnap.include) pkg.reactSnap.include = [];
              pkg.reactSnap.include.push(...jobRoutes, ...portfolioRoutes, ...bespokeRoutes, '/portfolio');
              pkg.reactSnap.include = [...new Set(pkg.reactSnap.include)];
              
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              console.log('Successfully injected dynamic SEO routes and configured error suppression.');
            } catch (err) {
              console.error('Error modifying package.json:', err);
              process.exit(1);
            }
          }
          processPackage();
          "

      # 5. Build application and generate pre-rendered static paths via react-snap
      - name: Execute System Production Build
        run: npm run build
        env:
          CI: false

      # 6. Post-Process HTML for Guaranteed SEO, Generate Sitemap, and Restore 404.html
      - name: Post-Process HTML, Generate Sitemap & Restore 404.html
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const baseUrl = 'https://nocapcode.cloud';
          const buildDir = path.join(process.cwd(), 'build');

          const file200 = path.join(buildDir, '200.html');
          if (fs.existsSync(file200)) {
            fs.unlinkSync(file200);
          }

          let metaData = { jobs: [], portfolioItems: [] };
          if (fs.existsSync('prerender-meta.json')) {
            metaData = JSON.parse(fs.readFileSync('prerender-meta.json', 'utf8'));
          }

          const walkSync = (dir, filelist = []) => {
            if (!fs.existsSync(dir)) return filelist;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const filepath = path.join(dir, file);
              if (fs.statSync(filepath).isDirectory()) {
                filelist = walkSync(filepath, filelist);
              } else if (
                filepath.endsWith('.html') &&
                !filepath.endsWith('404.html') &&
                !filepath.endsWith('404-backup.html') &&
                !filepath.endsWith('404_2.html') &&
                !filepath.endsWith('200.html')
              ) {
                filelist.push(filepath);
              }
            }
            return filelist;
          };
          
          const htmlFiles = walkSync(buildDir);
          const today = new Date().toISOString().split('T')[0];
          
          let sitemapContent = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n';
          sitemapContent += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n';
          
          for (const file of htmlFiles) {
            let route = file.replace(buildDir, '').replace(/\\\\/g, '/');
            route = route.replace('/index.html', '').replace('.html', '');
            if (route === '' || route === '/') {
              route = '/';
            } else if (!route.endsWith('/')) {
              route = route + '/';
            }
            const locUrl = \`\${baseUrl}\${route}\`;

            let html = fs.readFileSync(file, 'utf8');

            if (!html.includes('<!--email_off-->')) {
              html = html.replace('<body', '<!--email_off--><body').replace('</body>', '</body><!--/email_off-->');
            }
            html = html.replace(/href=\"mailto:[^\"]*\"/gi, 'href=\"https://nocapcode.cloud/contact/\"');

            if (route === '/at/') {
              html = html.replace('<html lang=\"en\"', '<html lang=\"de-at\"');
            }

            if (!/<title>[^<]+<\/title>/i.test(html)) {
              let pageTitle = 'NoCapCode™ | Custom Software Development & AI Automation';
              let pageDesc = 'NoCapCode builds custom software, SaaS platforms, websites, mobile apps, and AI automation systems for startups and modern businesses worldwide.';
              let h1Text = 'NoCapCode Engineering & Product Case Study';
              let bodyText = 'Explore how NoCapCode engineers scalable software systems, enterprise web platforms, and AI automation solutions for modern teams.';

              if (route.startsWith('/careers/') && route !== '/careers/') {
                const jobId = route.split('/').filter(Boolean)[1];
                const jobObj = metaData.jobs.find(j => j._id === jobId);
                const roleTitle = jobObj && jobObj.title ? jobObj.title : 'Software Engineering Role';
                const dept = jobObj && jobObj.department ? jobObj.department : 'Engineering';
                pageTitle = \`\${roleTitle} | Careers at NoCapCode\`.slice(0, 68);
                pageDesc = \`Apply for the \${roleTitle} role in the \${dept} team at NoCapCode and help build scalable software systems and AI automation products.\`.slice(0, 155);
                h1Text = roleTitle;
                bodyText = (jobObj && jobObj.description ? jobObj.description.replace(/<[^>]+>/g, ' ') : pageDesc) + ' Join our engineering and product team at NoCapCode to build resilient, production-grade software architectures, cloud platforms, and intelligent workflow systems.';
              } else if (route.includes('medvitals-ai-triage')) {
                pageTitle = 'MedVitals AI | HIPAA-Compliant AI Patient Triage | NoCapCode';
                pageDesc = 'Explore how NoCapCode engineered MedVitals AI, a HIPAA-compliant AI patient triage platform designed for clinical accuracy and healthcare scale.';
                h1Text = 'MedVitals AI — HIPAA-Compliant AI Patient Triage';
                bodyText = 'MedVitals AI is an enterprise healthcare triage platform engineered by NoCapCode. Built with HIPAA-compliant cloud infrastructure, real-time clinical intake workflows, and low-latency AI diagnostics to streamline patient routing and hospital operations.';
              } else if (route.startsWith('/portfolio/') && route !== '/portfolio/') {
                const projId = route.split('/').filter(Boolean)[1];
                const projObj = metaData.portfolioItems.find(p => p._id === projId || p.id === projId);
                const projTitle = projObj && projObj.title ? projObj.title : 'Enterprise Software Case Study';
                pageTitle = \`\${projTitle} | NoCapCode Portfolio\`.slice(0, 68);
                pageDesc = (projObj && projObj.subtitle ? projObj.subtitle : 'Explore enterprise software case studies, SaaS platforms, and architecture breakdowns engineered by NoCapCode.').slice(0, 155);
                h1Text = projTitle;
                bodyText = (projObj && projObj.content ? projObj.content.replace(/<[^>]+>/g, ' ') : pageDesc) + ' Engineered by NoCapCode for long-term scalability, high availability, and operational clarity.';
              }

              const headInjection = \`
                <title>\${pageTitle}</title>
                <meta name=\"description\" content=\"\${pageDesc}\" />
                <link rel=\"canonical\" href=\"\${locUrl}\" />
                <meta property=\"og:title\" content=\"\${pageTitle}\" />
                <meta property=\"og:description\" content=\"\${pageDesc}\" />
                <meta property=\"og:url\" content=\"\${locUrl}\" />
                <meta name=\"twitter:title\" content=\"\${pageTitle}\" />
                <meta name=\"twitter:description\" content=\"\${pageDesc}\" />
              \`;
              html = html.replace('</head>', headInjection + '</head>');

              if (!/<h1[^>]*>/i.test(html)) {
                const fallbackMain = \`
                  <main style=\"color:#fff;background:#000;padding:60px 24px;max-width:960px;margin:0 auto;font-family:Inter,sans-serif;\">
                    <nav style=\"margin-bottom:32px;display:flex;gap:20px;\">
                      <a href=\"/\" style=\"color:#fff;\">Home</a>
                      <a href=\"/about/\" style=\"color:#fff;\">About</a>
                      <a href=\"/services/\" style=\"color:#fff;\">Services</a>
                      <a href=\"/portfolio/\" style=\"color:#fff;\">Portfolio</a>
                      <a href=\"/careers/\" style=\"color:#fff;\">Careers</a>
                      <a href=\"/contact/\" style=\"color:#fff;\">Contact</a>
                    </nav>
                    <h1>\${h1Text}</h1>
                    <p style=\"margin-top:16px;line-height:1.7;\">\${bodyText}</p>
                    <p style=\"margin-top:16px;line-height:1.7;\">At NoCapCode, every system we deliver is architected for long-term maintainability, clear ownership, and production resilience. Explore our <a href=\"/portfolio/\" style=\"color:#5b3df5;\">portfolio</a>, view open roles on our <a href=\"/careers/\" style=\"color:#5b3df5;\">careers page</a>, or <a href=\"/clarity/\" style=\"color:#5b3df5;\">start with clarity</a>.</p>
                  </main>
                \`;
                html = html.replace('<div id=\"root\"></div>', \`<div id=\"root\">\${fallbackMain}</div>\`);
              }
            }

            if (route === '/careers/' && metaData.jobs.length > 0) {
              const jobLinks = metaData.jobs.map(j => \`<a href=\"/careers/\${j._id}/\">\${j.title || 'Career Opportunity'}</a>\`).join(' ');
              html = html.replace('</body>', \`<nav aria-label=\"All Open Positions\" style=\"display:none;\">\${jobLinks}</nav></body>\`);
            }
            if (route === '/portfolio/') {
              const portLinks = metaData.portfolioItems.map(p => \`<a href=\"/portfolio/\${p._id || p.title}/\">\${p.title || 'Case Study'}</a>\`).join(' ');
              const staticPortLinks = '<a href=\"/portfolio/website-design/medvitals-ai-triage/\">MedVitals AI</a> <a href=\"/portfolio/logo-redesign/symbol-of-identity/\">Symbol of Identity</a> <a href=\"/portfolio/logo-redesign/axon-human-connection/\">AXON</a>';
              html = html.replace('</body>', \`<nav aria-label=\"All Portfolio Case Studies\" style=\"display:none;\">\${staticPortLinks} \${portLinks}</nav></body>\`);
            }

            fs.writeFileSync(file, html);
            
            sitemapContent += '  <url>\n';
            sitemapContent += \`    <loc>\${locUrl}</loc>\n\`;
            sitemapContent += \`    <lastmod>\${today}</lastmod>\n\`;
            sitemapContent += '  </url>\n';
          }
          
          sitemapContent += '</urlset>';
          fs.writeFileSync(path.join(buildDir, 'sitemap.xml'), sitemapContent);

          if (fs.existsSync('public/404-backup.html')) {
            fs.copyFileSync('public/404-backup.html', path.join(buildDir, '404.html'));
          }
          console.log('Successfully post-processed ' + htmlFiles.length + ' HTML files and generated sitemap.xml');
          "

      # 7. Securely deploy compiled assets to the target gh-pages branch
      - name: Deploy Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true